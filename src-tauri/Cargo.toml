[package]
name = "trace"
version = "0.1.0"
description = "Issue-tracker Kanban for managing parallel Claude coding sessions"
authors = ["ron"]
edition = "2021"

[lib]
name = "trace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable`: child webviews in trace's window, for the Browser tab (`browser::webview`)
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Interactive PTY transport (hosts the real Claude TUI)
portable-pty = "0.8"
base64 = "0.22"
sha2 = "0.10"

# Loopback MCP endpoint serving trace's tools to its own agents
tiny_http = "0.12"

# Jira Cloud REST client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }

# Remote execution: Vercel Sandbox PTYs (and later peer traces) over WebSocket,
# blocking so each session pumps on its own std::thread like a local PTY.
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
regex = "1"
thiserror = "2"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Settings → Repositories → Import from Conductor: reads a copy of its SQLite
# database (bundled, so Windows and Linux build without a system libsqlite),
# its `settings.toml` layers, and stages the copy in a private temp dir.
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "0.9"
tempfile = "3"
# ~2.3: 2.4+ needs tauri 2.12 (and @tauri-apps/api 2.12); bump them together.
tauri-plugin-clipboard-manager = "~2.3.2"

[target.'cfg(unix)'.dependencies]
# Process signals
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# The Plan tab's Save as PDF: WKWebView's own print operation, saving to a file.
# The same versions wry uses, so nothing new is built.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSDictionary",
    "NSGeometry",
    "NSString",
    "NSURL",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSPrintInfo",
    "NSPrintOperation",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-app-kit",
    "WKWebView",
] }
# Recording builds only (`recording` feature): WKWebView snapshots for the site's clips.
block2 = { version = "0.6", optional = true }

[target.'cfg(windows)'.dependencies]
# Checking whether a process is alive; job objects stop a precheck's whole tree
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Power",
    "Win32_System_Threading",
] }
# Printing the Plan tab to PDF through WebView2 (the versions wry and tauri use)
webview2-com = "0.38"
windows = "0.61"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# The homepage clip recorder's build (site/README.md, "Recording clips"). Off by
# default, and never enabled by the release workflow: it reads a demo config dir
# from the environment, and lets a local script drive the page and capture frames.
recording = [
    "dep:block2",
    "objc2-foundation/NSData",
    "objc2-foundation/NSError",
    "objc2-foundation/NSValue",
    "objc2-web-kit/block2",
    "objc2-web-kit/objc2-core-foundation",
    "objc2-web-kit/WKSnapshotConfiguration",
    "objc2-app-kit/NSBitmapImageRep",
    "objc2-app-kit/NSGraphics",
    "objc2-app-kit/NSImage",
    "objc2-app-kit/NSImageRep",
]
